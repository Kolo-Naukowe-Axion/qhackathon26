</g>
<g font-family="sans-serif" fill="#453722">
<g font-size="26" font-weight="bold"><text x="57" y="122">Orders + rules</text><text x="329" y="122">Batch catalogue</text><text x="601" y="122">QUBO</text><text x="873" y="122">Solver</text><text x="1145" y="122">Checked plan</text></g>
<g font-size="20"><text x="57" y="163">Meals, departures</text><text x="57" y="195">Recipes, resources</text><text x="57" y="227">Freshness, outages</text>
<text x="329" y="163">Enumerate legal</text><text x="329" y="195">individual batches</text><text x="329" y="227">One checkbox each</text>
<text x="601" y="163">Meal + waste costs</text><text x="601" y="195">Exclusivity + clashes</text><text x="601" y="227">Linear + pair terms</text>
<text x="873" y="163">QAOA / VQE</text><text x="873" y="195">or VeloxQ</text><text x="873" y="227">Select batch bits</text>
<text x="1145" y="163">Look up instructions</text><text x="1145" y="195">Rebuild the schedule</text><text x="1145" y="227">Check feasibility/cost</text></g>
</g>
