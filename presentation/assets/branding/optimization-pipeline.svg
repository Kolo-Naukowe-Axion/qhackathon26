<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
<title id="title">From kitchen orders to a checked production schedule</title>
<desc id="desc">Orders and resource rules generate locally legal batch instructions. One bit selects an instruction. Costs and conflicts form a QUBO, solved by QAOA, VQE or VeloxQ. Selected instructions are decoded and independently checked. Small quantum portfolios can exclude useful choices; classical references measure that gap.</desc>
<rect width="1400" height="390" fill="#172d25"/>
<g font-family="monospace" fill="#bdd49a"><text x="36" y="43" font-size="17" letter-spacing="2">HOW THE OPTIMIZATION WORKS</text></g>
<g fill="#f5e2b8" stroke="#b29463" stroke-width="2">
