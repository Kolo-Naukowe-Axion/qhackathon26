<g font-family="sans-serif" font-size="21" fill="#d6dfc8"><text x="36" y="311">We enumerate individual batch instructions; the solver chooses a compatible collection.</text><text x="36" y="349" fill="#a9bb96">Quantum runs use restricted catalogues. Exact and CP-SAT references separate representation loss from search loss.</text></g>
